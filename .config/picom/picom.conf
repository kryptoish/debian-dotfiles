# DEBIAN FORKY
backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";

# --- Optimized Preset Animations for i3 Tiling ---
animations = (
  {
    triggers = ["open"];
    preset = "appear";
    scale = 0.85;             # 1.0 disables zooming, opening windows instantly in-place
    duration = 0.15;
  },
  {
    triggers = ["close"];
    preset = "disappear";
    scale = 0.85;             # 1.0 disables zooming, closing instantly in-place
    duration = 0.12;
  },
  {
    # This tracks when i3 automatically resizes/repositions windows
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.18;         # Smooth slide/resize transition when layout shifts
  }
)

# Keep fading off to prevent overlapping visual mud during tiling shifts
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Window settings
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
shadow = false;

wintypes:
{
  tooltip = { fade = false; shadow = false; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
};

